<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Food Bank</title>
  <link rel="stylesheet" href="fbstyles.css">
</head>
<body>
  <!-- Keep the header and nav exactly as they appear in your foodbank.html template -->
  <header>
    <h1>Community Food Bank</h1>
  </header>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="volunteer.html">Volunteer</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>
    <h4>Please complete the form below for more information about our volunteer opportunities.</h4>

    <form>
      <label for="fName">First Name:</label>
      <input type="text" name="fName" id="fName">

      <label for="lName">Last Name:</label>
      <input type="text" name="lName" id="lName">

      <label for="email">Email Address:</label>
      <input type="email" name="email" id="email">

      <label for="phone">Phone Number:</label>
      <input type="tel" name="phone" id="phone">

      <label for="comments">Comments:</label>
      <textarea name="comments" id="comments" rows="3" cols="25"></textarea>

      <input type="submit" value="Submit">
      <input type="reset" value="Reset">
    </form>
  </main>

  <footer>
    <p>&copy; Community Food Bank</p>
  </footer>
</body>
</html>
